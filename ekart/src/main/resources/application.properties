spring.datasource.url=jdbc:mysql://ekart-mysql:3306/ekart
spring.datasource.username=root
spring.datasource.password=EkartRoot2026!ChangeMe


mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.ekart.model
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

server.port=8081

spring.data.redis.host=ekart-redis
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# Logging
logging.file.name=logs/ekart.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{40} - %msg%n
logging.level.root=INFO
logging.level.com.example.ekart.repository=DEBUG

# Kafka
spring.kafka.bootstrap-servers=ekart-kafka:9092
spring.kafka.consumer.group-id=ekart-group

# Kafka producer JSON serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Kafka consumer JSON deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.ekart.model
